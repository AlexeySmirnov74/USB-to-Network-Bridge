[package]
name = "usbbridge"
version = "0.2.0"
edition = "2024"
license = "MIT"

[dependencies]
socket2 = "0.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
base64 = "0.22"

[target.'cfg(windows)'.dependencies]
native-tls = "0.2"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_IO", "Win32_System_Threading", "Win32_System_LibraryLoader", "Win32_System_Pipes", "Win32_Storage_FileSystem", "Win32_Devices_DeviceAndDriverInstallation", "Win32_Devices_Usb", "Win32_Security", "Win32_Security_Cryptography", "Win32_Security_Authorization", "Win32_NetworkManagement_IpHelper", "Win32_NetworkManagement_Ndis", "Win32_Networking_WinSock", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_UI_Controls", "Win32_UI_HiDpi", "Win32_UI_Input_KeyboardAndMouse", "Win32_Graphics_Gdi", "Win32_Graphics_Dwm"] }

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"

[[bin]]
name = "usbbridge"
path = "src/bin/control.rs"

[[bin]]
name = "usbbridge-server"
path = "src/bin/server.rs"

[[bin]]
name = "usbbridge-client"
path = "src/bin/client.rs"

[[bin]]
name = "usbbridge-agent"
path = "src/bin/agent.rs"
