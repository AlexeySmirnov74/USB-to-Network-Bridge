<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1424" viewBox="0 0 1200 1424" role="img" aria-labelledby="title desc">
  <title id="title">USB to Network Bridge v0.2.14 — USB sharing and two video destinations</title>
  <desc id="desc">Windows 11 x64. Three independent paths: physical USB devices from server to clients over USB/IP TCP 3240; client video from Unity Capture Server slot 0 or another selected source to a server USB/UVC camera over authenticated MJPEG TCP 13251; and Unity Capture Client slot 1 to a separate client-local USB/UVC camera over loopback TCP 13251. Each generated camera is imported on its own PC over loopback USB/IP TCP 13250 using the signed USBIP-WIN2 controller and inbox Windows camera driver. Camera names and serials are independent. Optional microphones generate local silence only. Native is the Rust userspace server, using the same unchanged signed VBoxUSB capture driver as usbipd-win. Complete MSI and portable packages include signed driver installers and the x64 Unity Capture filter for offline setup and repair. Client setup automatically registers the two independent Unity Capture slots. OBS and producer applications are separate. Ports are configurable defaults; use a trusted LAN or VPN.</desc>
  <defs>
    <linearGradient id="background" x2="1" y2="1"><stop stop-color="#0b1220"/><stop offset="1" stop-color="#14273a"/></linearGradient>
    <marker id="usb-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#4cdae8"/></marker>
    <marker id="video-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#bdacff"/></marker>
    <marker id="local-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#72e2b6"/></marker>
    <style>
      text{font-family:Segoe UI,Arial,sans-serif;fill:#edf4fc}
      .heading{font-size:23px;font-weight:700}.body{font-size:18px}.small{font-size:16px}
      .label{font-size:16px;font-weight:700;letter-spacing:.7px}.muted{fill:#b5c7dc}
      .cyan{fill:#72e6ef}.purple{fill:#cebeff}.green{fill:#86edc4}
      .card{fill:#18283b;stroke:#3b506b;stroke-width:1.2}
      .icon{fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
      .usb{fill:none;stroke:#4cdae8;stroke-width:3;marker-end:url(#usb-arrow)}
      .video{fill:none;stroke:#bdacff;stroke-width:3;marker-end:url(#video-arrow)}
      .local{fill:none;stroke:#72e2b6;stroke-width:3;marker-end:url(#local-arrow)}
    </style>
    <symbol id="camera" viewBox="0 0 32 32"><g class="icon"><rect x="4" y="7" width="24" height="18" rx="5"/><circle cx="16" cy="16" r="5"/><path d="M11 29h10M16 25v4M8 11h1"/></g></symbol>
    <symbol id="phone" viewBox="0 0 32 32"><g class="icon"><rect x="8" y="2" width="16" height="28" rx="3"/><path d="M13 6h6M14 26h4"/></g></symbol>
    <symbol id="usb" viewBox="0 0 32 32"><g class="icon"><path d="M16 28V4m-4 4 4-4 4 4M16 18l-7-5v-3M16 23l7-5v-5"/><circle cx="9" cy="8" r="2"/><path d="M21 9h4v4h-4Z"/><circle cx="16" cy="28" r="2"/></g></symbol>
    <symbol id="computer" viewBox="0 0 32 32"><g class="icon"><rect x="3" y="4" width="26" height="19" rx="3"/><path d="M11 29h10M16 23v6M3 19h26"/></g></symbol>
    <symbol id="microphone" viewBox="0 0 32 32"><g class="icon"><rect x="11" y="3" width="10" height="17" rx="5"/><path d="M7 14v2a9 9 0 0 0 18 0v-2M16 25v5M11 30h10"/></g></symbol>
  </defs>

  <rect width="1200" height="1424" rx="24" fill="url(#background)"/>
  <text x="40" y="49" font-size="32" font-weight="700">USB to Network Bridge</text>
  <text x="40" y="81" class="body muted">Physical USB over IP + two independent video destinations</text>
  <rect x="1024" y="22" width="136" height="36" rx="18" fill="#223b53" stroke="#47637d"/>
  <text x="1092" y="46" text-anchor="middle" font-size="18" font-weight="600">v0.2.14</text>
  <text x="1160" y="81" text-anchor="end" class="small muted">Windows 11 x64</text>

  <!-- Path 1: real USB devices, with full-duplex USB/IP traffic. -->
  <rect x="24" y="112" width="1152" height="288" rx="18" fill="#101f30" stroke="#30556a"/>
  <circle cx="59" cy="147" r="17" fill="#174c59"/>
  <text x="59" y="153" text-anchor="middle" font-size="18" font-weight="700" class="cyan">1</text>
  <text x="91" y="155" class="heading">Share physical USB devices</text>
  <text x="1152" y="153" text-anchor="end" class="label cyan">SERVER → CLIENT</text>

  <rect x="44" y="178" width="208" height="176" rx="12" class="card"/>
  <text x="62" y="208" font-size="19" font-weight="600">USB equipment</text>
  <g color="#91c8e2"><use href="#camera" x="62" y="225" width="25" height="25"/><use href="#phone" x="62" y="266" width="25" height="25"/><use href="#usb" x="62" y="307" width="25" height="25"/></g>
  <text x="97" y="244" class="body">Webcam / mic</text>
  <text x="97" y="285" class="body">Phone / storage</text>
  <text x="97" y="326" class="body">HID / Bluetooth</text>
  <path d="M258 269H273" class="usb"/>

  <rect x="280" y="178" width="300" height="176" rx="12" class="card"/>
  <use href="#computer" x="298" y="192" width="27" height="27" color="#72e6ef"/>
  <text x="336" y="213" font-size="22" font-weight="700">Windows server</text>
  <text x="298" y="250" class="body">Unchanged signed VBoxUSB</text>
  <rect x="298" y="265" width="264" height="36" rx="7" fill="#1c4352"/>
  <text x="430" y="289" text-anchor="middle" font-size="18" font-weight="600" class="cyan">Rust Native or usbipd-win</text>
  <text x="298" y="333" class="small muted">One remote owner per device</text>

  <text x="720" y="227" text-anchor="middle" font-size="19" font-weight="600" class="cyan">LAN / VPN</text>
  <path d="M608 269H832" class="usb" marker-start="url(#usb-arrow)"/>
  <text x="720" y="304" text-anchor="middle" class="body">USB/IP · TCP 3240</text>
  <text x="720" y="331" text-anchor="middle" class="small muted">Full-duplex USB traffic</text>

  <rect x="860" y="178" width="296" height="176" rx="12" class="card"/>
  <use href="#computer" x="878" y="192" width="27" height="27" color="#72e6ef"/>
  <text x="916" y="213" font-size="22" font-weight="700">Windows client(s)</text>
  <text x="878" y="250" class="body">Signed USBIP-WIN2 controller</text>
  <text x="878" y="286" class="body">Windows device-class drivers</text>
  <text x="878" y="322" class="small muted">Imported USB → normal apps</text>
  <text x="44" y="382" class="small muted">Discovery: UDP 3241 · Device catalog: TCP 3241 · Direct IP / saved servers · Multiple clients and servers</text>

  <!-- Path 2: the producer is on the client; the resulting USB camera is on the server. -->
  <rect x="24" y="424" width="1152" height="280" rx="18" fill="#1a2035" stroke="#55496f"/>
  <circle cx="59" cy="459" r="17" fill="#40345f"/>
  <text x="59" y="465" text-anchor="middle" font-size="18" font-weight="700" class="purple">2</text>
  <text x="91" y="467" class="heading">Send client video to the server</text>
  <text x="1152" y="465" text-anchor="end" class="label purple">CLIENT → SERVER</text>

  <rect x="44" y="490" width="400" height="180" rx="12" class="card"/>
  <text x="64" y="517" class="label purple">CLIENT PC · VIDEO SOURCE</text>
  <text x="64" y="554" font-size="21" font-weight="600">Unity Capture Server · slot 0</text>
  <text x="64" y="586" class="body muted">DeepLive / OBS / selected DirectShow source</text>
  <text x="64" y="623" class="body">Capture → MJPEG encoding → sender</text>
  <text x="64" y="652" font-size="15" class="muted">Producer + sender in the same Windows user session</text>

  <text x="578" y="525" text-anchor="middle" class="small purple">LAN / VPN</text>
  <text x="578" y="563" text-anchor="middle" font-size="20" font-weight="600">TCP 13251</text>
  <path d="M470 590H688" class="video"/>
  <text x="578" y="625" text-anchor="middle" font-size="17">Authenticated MJPEG</text>
  <text x="578" y="651" text-anchor="middle" font-size="15" class="muted">Images are not encrypted</text>

  <rect x="724" y="490" width="432" height="180" rx="12" fill="#272a43" stroke="#79699b"/>
  <text x="746" y="517" class="label purple">SERVER PC · USB/UVC CAMERA</text>
  <use href="#camera" x="746" y="532" width="33" height="33" color="#cebeff"/>
  <text x="791" y="560" font-size="27" font-weight="600">Virtual USB camera</text>
  <text x="746" y="594" class="body">Receiver → USB camera → server video apps</text>
  <text x="746" y="624" class="body purple">Local USB/IP · 127.0.0.1:13250</text>
  <text x="746" y="652" font-size="17" class="muted">Signed USBIP-WIN2 + inbox usbvideo.sys</text>
  <text x="44" y="693" class="small muted">The receiver exposes a software USB/UVC endpoint on the server through its signed virtual USB controller.</text>

  <!-- Path 3: an independent sender and receiver, both on the client. -->
  <rect x="24" y="728" width="1152" height="252" rx="18" fill="#112a2b" stroke="#39605b"/>
  <circle cx="59" cy="763" r="17" fill="#205646"/>
  <text x="59" y="769" text-anchor="middle" font-size="18" font-weight="700" class="green">3</text>
  <text x="91" y="771" class="heading">Keep a second camera on the client</text>
  <text x="1152" y="769" text-anchor="end" class="label green">CLIENT → SAME CLIENT</text>

  <rect x="44" y="794" width="400" height="154" rx="12" class="card"/>
  <text x="64" y="821" class="label green">CLIENT PC · SEPARATE VIDEO SOURCE</text>
  <text x="64" y="858" font-size="21" font-weight="600">Unity Capture Client · slot 1</text>
  <text x="64" y="891" class="body">Independent local sender and key</text>
  <text x="64" y="924" class="small muted">Kept separate from the server video route</text>

  <text x="578" y="818" text-anchor="middle" class="label green">LOOPBACK ONLY</text>
  <text x="578" y="851" text-anchor="middle" font-size="19" font-weight="600">127.0.0.1:13251</text>
  <path d="M470 870H688" class="local"/>
  <text x="578" y="905" text-anchor="middle" font-size="17">Authenticated MJPEG</text>
  <text x="578" y="931" text-anchor="middle" font-size="15" class="muted">No LAN video connection</text>

  <rect x="724" y="794" width="432" height="154" rx="12" fill="#183a35" stroke="#4f8974"/>
  <text x="746" y="821" class="label green">CLIENT PC · LOCAL USB/UVC CAMERA</text>
  <use href="#camera" x="746" y="831" width="33" height="33" color="#86edc4"/>
  <text x="791" y="858" font-size="27" font-weight="600">Virtual USB camera</text>
  <text x="746" y="891" class="body">Receiver → USB camera → client video apps</text>
  <text x="746" y="924" class="body green">Local USB/IP · 127.0.0.1:13250</text>
  <text x="44" y="971" class="small muted">Each producer output feeds its selected destination; the two routes keep independent senders, keys and settings.</text>

  <!-- Shared camera behavior, including receiver-local silent audio. -->
  <rect x="24" y="1004" width="1152" height="102" rx="14" fill="#152439" stroke="#3c536c"/>
  <text x="44" y="1034" font-size="20" font-weight="600">Both USB/UVC cameras</text>
  <text x="44" y="1062" class="small muted">Editable names · Windows USB/UVC devices · stable serials</text>
  <text x="44" y="1089" font-size="15" class="muted">No frames for 2 s → black; the camera stays connected</text>
  <path d="M594 1022V1088" stroke="#3c536c"/>
  <use href="#microphone" x="615" y="1014" width="24" height="24" color="#f1ce91"/>
  <text x="650" y="1034" font-size="20" font-weight="600">Optional USB microphone</text>
  <text x="616" y="1062" class="small muted">Off by default · receiver-local 48 kHz mono silence</text>
  <text x="616" y="1089" font-size="15" class="muted">No physical microphone capture or audio forwarding</text>

  <rect x="24" y="1130" width="568" height="218" rx="14" fill="#111e30" stroke="#354d68"/>
  <text x="44" y="1165" font-size="22" font-weight="600" class="cyan">Control &amp; recovery</text>
  <text x="44" y="1198" font-size="17">GUI / tray / CLI · startup · supervisors + health checks</text>
  <text x="44" y="1228" font-size="17">Saved servers and devices · automatic USB reconnect</text>
  <text x="44" y="1258" font-size="17">Full Exit stops this role's owned background processes</text>
  <text x="44" y="1288" class="small muted">Trusted LAN/VPN · IP allowlist · HTTP(S) / SOCKS5 for USB</text>
  <text x="44" y="1319" class="small muted">Bundled Unity Capture · OBS / producer app separate</text>

  <rect x="608" y="1130" width="568" height="218" rx="14" fill="#111e30" stroke="#354d68"/>
  <text x="628" y="1165" font-size="22" font-weight="600" class="green">Portable + MSI · offline setup</text>
  <text x="628" y="1198" font-size="17">Copy both launchers with the complete app/ folder</text>
  <text x="628" y="1228" font-size="17">Bundled signed usbipd-win + USBIP-WIN2 installers</text>
  <text x="628" y="1258" font-size="17">New PC: fresh server setup; client chooses Keep / New</text>
  <text x="628" y="1288" class="small muted">Driver + Unity setup locally · no runtime downloads</text>
  <text x="628" y="1319" class="small muted">Upstream drivers unchanged · Secure Boot can stay enabled</text>

  <text x="40" y="1378" class="small muted">Ports are configurable defaults. Each PC has its own 13250/13251 pair. Camera names do not set resolution.</text>
  <text x="40" y="1404" class="small muted">Native is the Rust userspace server; both backends use the same signed capture driver.</text>
</svg>
